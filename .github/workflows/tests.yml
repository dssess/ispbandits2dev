name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Check shell syntax
        run: bash -n install.sh quick-install.sh scripts/refresh-tls.sh
      - name: Validate installer check mode
        run: ./install.sh --check

  distro-source-check:
    name: Installer source checks on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, ubuntu:24.04, debian:12, debian:13]
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install source-check runtime
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3
      - name: Run distro-specific installer source checks
        run: ./install.sh --check

  ssh-http-integration:
    name: HTTP Custom SSH relay integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test loopback SSH relay behavior
        run: PYTHONPATH=src python3 scripts/test-sshws-integration.py
